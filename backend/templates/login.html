<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — ПравоТека</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f5f7fb; margin: 0; color: #172033; }
    main { max-width: 360px; margin: 12vh auto; background: white; padding: 32px; border-radius: 16px; box-shadow: 0 8px 30px #17203318; }
    label { display: block; margin: 16px 0 6px; }
    input, button { box-sizing: border-box; width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccd3df; }
    button { margin-top: 20px; border: 0; background: #2957d3; color: white; font-weight: 700; cursor: pointer; }
    .error { color: #b42318; }
  </style>
</head>
<body><main>
  <h1>ПравоТека</h1>
  <p>Защищённая административная панель</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/admin/login">
    <label for="username">Логин</label><input id="username" name="username" autocomplete="username" required>
    <label for="password">Пароль</label><input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Войти</button>
  </form>
</main></body>
</html>
