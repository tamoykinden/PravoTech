[project]
name = "pravoteka"
version = "0.1.0"
description = "Сервис оперативной юридической поддержки в Telegram и VK"
requires-python = ">=3.11,<3.14"
dependencies = [
    "aiofiles==24.1.0",
    "aiogram==3.28.2",
    "aiohttp==3.13.5",
    "aiohttp-socks>=0.11.0",
    "alembic==1.18.4",
    "asyncpg==0.31.0",
    "fastapi==0.116.1",
    "httpx==0.28.1",
    "itsdangerous==2.2.0",
    "jinja2==3.1.6",
    "loguru==0.7.3",
    "pwdlib[argon2]==0.2.1",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.20",
    "requests>=2.34.2",
    "sqlalchemy[asyncio]==2.0.49",
    "uvicorn==0.35.0",
    "vkbottle==4.8.2",
    "yadisk==3.4.0",
]

[dependency-groups]
dev = [
    "isort==8.0.1",
    "pre-commit==4.6.0",
    "pytest==8.4.1",
    "pytest-asyncio==1.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
